<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOM Manipulation</title>
  </head>
  <body>
    <p id="paragraph" style="color:brown; font-size: 15px;">What is your name?</p>
    <a href="#" id="google-link" class="link">Google</a>

    <div id="content">
      <h1 id="title">Main title</h1>
      <ul id="item-list">
        <li>Banane</li>
        <li>Pomme</li>
        <li>Poire</li>
      </ul>
    </div>

    <div id="container">
        <button id="1">Click Me</button>
        <button id="2">Click Me</button>
        <button id="3">Click Me</button>
    </div>


    <button id="add-item-button">Add item</button>

    <form action="" method="">
        <label for="username">Name</label>
        <input name="username" type="text" placeholder="Enter your name...." />
        <button id="send-btn">Send</button>
    </form>
    <!-- make sure you load .js file in the end so it executes when the DOM is ready -->
    <h3 id="secondary-title">test</h3>
    <script src="index.js"></script>
  </body>
</html>
